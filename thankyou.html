<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>타일허브 | 문의 접수 완료</title>
  <meta name="description" content="타일허브 문의가 정상적으로 접수되었습니다." />
  <style>
    :root{
      --bg:#ffffff;
      --soft:#f6f6f4;
      --soft-2:#f2f3f5;
      --line:#e9ebee;
      --text:#111318;
      --muted:#68707c;
      --max:980px;
      --shadow:0 18px 50px rgba(0,0,0,.07);
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Apple SD Gothic Neo","Noto Sans KR","Segoe UI",sans-serif;
      background:radial-gradient(circle at top, rgba(17,19,24,.05) 0%, rgba(255,255,255,0) 62%), #fff;
      color:var(--text);
      line-height:1.65;
      letter-spacing:-0.02em;
    }
    a{text-decoration:none;color:inherit}
    .container{max-width:var(--max);margin:0 auto;padding:0 28px}
    .site-header{
      position:sticky;top:0;z-index:30;
      backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
      background:rgba(255,255,255,.82);border-bottom:1px solid rgba(17,19,24,.06);
    }
    .nav{min-height:72px;display:flex;align-items:center;justify-content:space-between;gap:20px}
    .brand{font-size:1.1rem;font-weight:700;letter-spacing:-0.03em}
    .brand-hub{color:#E53935}
    .brand small{display:block;color:var(--muted);font-size:.74rem;font-weight:500;letter-spacing:0}
    .btn{display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:0 24px;border-radius:999px;border:1px solid transparent;font-weight:700;font-size:.98rem;transition:transform .24s ease, box-shadow .24s ease, background .24s ease;white-space:nowrap}
    .btn:hover{transform:translateY(-2px)}
    .btn-dark{background:#111318;color:#fff}
    .btn-dark:hover{box-shadow:var(--shadow)}
    main{padding:110px 0 140px}
    .thankyou-card{max-width:760px;margin:0 auto;padding:52px 44px;border-radius:34px;border:1px solid var(--line);background:linear-gradient(180deg,#ffffff 0%,#fbfbfa 100%);box-shadow:var(--shadow);text-align:center}
    .eyebrow{display:inline-flex;padding:8px 18px;border-radius:999px;background:var(--soft-2);color:#36404a;font-size:.88rem;font-weight:700;margin-bottom:26px}
    h1{margin:0;font-size:clamp(2.3rem,6vw,4.6rem);line-height:1.1;letter-spacing:-0.06em}
    .lead{margin:22px auto 0;max-width:560px;color:var(--muted);font-size:1.05rem;line-height:1.82}
    .thanks{margin:10px 0 0;font-size:1.02rem;font-weight:700;color:#2a3139}
    .actions{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin-top:34px}
    @media (max-width:760px){
      .container{padding:0 20px}
      main{padding:72px 0 96px}
      .thankyou-card{padding:34px 24px;border-radius:26px}
      .actions{flex-direction:column}
      .btn{width:100%}
    }
  
    .header-tools{
      display:flex;
      align-items:center;
      gap:12px;
      flex-shrink:0;
    }

    .header-tools .btn{
      width:auto;
    }

    .lang-switcher-wrap{
      position:relative;
    }

    .lang-switcher{
      appearance:none;
      -webkit-appearance:none;
      min-width:106px;
      height:48px;
      padding:0 36px 0 14px;
      border-radius:999px;
      border:1px solid rgba(17,19,24,.12);
      background:#fff;
      color:#111318;
      font-size:.9rem;
      font-weight:700;
      letter-spacing:-0.02em;
      cursor:pointer;
      outline:none;
    }

    .lang-switcher-wrap::after{
      content:"▾";
      position:absolute;
      right:15px;
      top:50%;
      transform:translateY(-52%);
      font-size:12px;
      color:#111318;
      pointer-events:none;
      opacity:.7;
    }

    .translate-anchor{
      position:absolute;
      left:-9999px;
      width:1px;
      height:1px;
      overflow:hidden;
    }

    .goog-te-banner-frame.skiptranslate{
      display:none !important;
    }

    body{
      top:0 !important;
    }

    @media (max-width:760px){
      .header-tools{
        margin-left:auto;
      }

      .header-tools .btn{
        width:auto;
      }

      .lang-switcher{
        min-width:98px;
        height:44px;
      }
    }

  </style>
</head>
<body>
  <header class="site-header">
    <div class="container nav">
      <a href="/" class="brand">타일<span class="brand-hub">허브</span><small>The <span class="brand-hub">Hub</span> of Tile Distribution</small></a>
      <div class="header-tools">
        <div class="lang-switcher-wrap">
          <select class="lang-switcher" data-lang-switcher aria-label="언어 선택">
            <option value="ko">한국어</option>
            <option value="en">English</option>
            <option value="zh-CN">中文</option>
          </select>
        </div>
      </div>
    </div>
  </header>

  <main>
    <div class="container">
      <section class="thankyou-card">
        <span class="eyebrow">Inquiry Complete</span>
        <h1>문의가 정상적으로 접수되었습니다.</h1>
        <p class="thanks">감사합니다.</p>
        <p class="lead">남겨주신 문의는 확인 후 빠른 시일 내에 담당자가 연락드리겠습니다.</p>
        <div class="actions">
          <a class="btn btn-dark" href="/">홈으로 돌아가기</a>
        </div>
      </section>
    </div>
  </main>

<div id="google_translate_element" class="translate-anchor" aria-hidden="true"></div>
<script>
  (function () {
    const STORAGE_KEY = "tilehub_lang";
    const COOKIE_NAME = "googtrans";

    function setCookie(value) {
      document.cookie = COOKIE_NAME + "=" + value + ";path=/";
      const host = window.location.hostname;
      if (host && host.includes(".")) {
        const parts = host.split(".");
        const baseDomain = "." + parts.slice(-2).join(".");
        document.cookie = COOKIE_NAME + "=" + value + ";path=/;domain=" + baseDomain;
      }
    }

    function applyStoredLanguage() {
      let saved = "ko";
      try {
        saved = window.localStorage.getItem(STORAGE_KEY) || "ko";
      } catch (error) {}

      if (saved === "en" || saved === "zh-CN") {
        setCookie("/ko/" + saved);
      } else {
        setCookie("/ko/ko");
      }

      return saved;
    }

    function bindSwitchers(saved) {
      const switchers = document.querySelectorAll("[data-lang-switcher]");
      switchers.forEach((switcher) => {
        switcher.value = saved;
        switcher.addEventListener("change", () => {
          const lang = switcher.value;
          try {
            window.localStorage.setItem(STORAGE_KEY, lang);
          } catch (error) {}

          if (lang === "en" || lang === "zh-CN") {
            setCookie("/ko/" + lang);
          } else {
            setCookie("/ko/ko");
          }

          window.location.reload();
        });
      });
    }

    const savedLanguage = applyStoredLanguage();

    window.googleTranslateElementInit = function () {
      if (window.google && window.google.translate) {
        new window.google.translate.TranslateElement({
          pageLanguage: "ko",
          autoDisplay: false,
          includedLanguages: "ko,en,zh-CN",
          layout: window.google.translate.TranslateElement.InlineLayout.SIMPLE
        }, "google_translate_element");
      }

      bindSwitchers(savedLanguage);
    };
  })();
</script>
<script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

</body>
</html>
