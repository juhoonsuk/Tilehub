<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>타일허브 | 문의 접수 완료</title>
  <meta name="description" content="타일허브 문의가 정상적으로 접수되었습니다." />
  <style>
    :root{
      --bg:#ffffff;
      --soft:#f6f6f4;
      --soft-2:#f2f3f5;
      --line:#e9ebee;
      --text:#111318;
      --muted:#68707c;
      --max:980px;
      --shadow:0 18px 50px rgba(0,0,0,.07);
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Apple SD Gothic Neo","Noto Sans KR","Segoe UI",sans-serif;
      background:radial-gradient(circle at top, rgba(17,19,24,.05) 0%, rgba(255,255,255,0) 62%), #fff;
      color:var(--text);
      line-height:1.65;
      letter-spacing:-0.02em;
    }
    a{text-decoration:none;color:inherit}
    .container{max-width:var(--max);margin:0 auto;padding:0 28px}
    .site-header{
      position:sticky;top:0;z-index:30;
      backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
      background:rgba(255,255,255,.82);border-bottom:1px solid rgba(17,19,24,.06);
    }
    .nav{min-height:72px;display:flex;align-items:center;justify-content:space-between;gap:20px}
    .brand{font-size:1.1rem;font-weight:700;letter-spacing:-0.03em}
    .brand-hub{color:#E53935}
    .brand small{display:block;color:var(--muted);font-size:.74rem;font-weight:500;letter-spacing:0}
    .btn{display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:0 24px;border-radius:999px;border:1px solid transparent;font-weight:700;font-size:.98rem;transition:transform .24s ease, box-shadow .24s ease, background .24s ease;white-space:nowrap}
    .btn:hover{transform:translateY(-2px)}
    .btn-dark{background:#111318;color:#fff}
    .btn-dark:hover{box-shadow:var(--shadow)}
    main{padding:110px 0 140px}
    .thankyou-card{max-width:760px;margin:0 auto;padding:52px 44px;border-radius:34px;border:1px solid var(--line);background:linear-gradient(180deg,#ffffff 0%,#fbfbfa 100%);box-shadow:var(--shadow);text-align:center}
    .eyebrow{display:inline-flex;padding:8px 18px;border-radius:999px;background:var(--soft-2);color:#36404a;font-size:.88rem;font-weight:700;margin-bottom:26px}
    h1{margin:0;font-size:clamp(2.3rem,6vw,4.6rem);line-height:1.1;letter-spacing:-0.06em}
    .lead{margin:22px auto 0;max-width:560px;color:var(--muted);font-size:1.05rem;line-height:1.82}
    .thanks{margin:10px 0 0;font-size:1.02rem;font-weight:700;color:#2a3139}
    .actions{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin-top:34px}
    @media (max-width:760px){
      .container{padding:0 20px}
      main{padding:72px 0 96px}
      .thankyou-card{padding:34px 24px;border-radius:26px}
      .actions{flex-direction:column}
      .btn{width:100%}
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container nav">
      <a href="/" class="brand">타일<span class="brand-hub">허브</span><small>The <span class="brand-hub">Hub</span> of Tile Distribution</small></a>
    </div>
  </header>

  <main>
    <div class="container">
      <section class="thankyou-card">
        <span class="eyebrow">Inquiry Complete</span>
        <h1>문의가 정상적으로 접수되었습니다.</h1>
        <p class="thanks">감사합니다.</p>
        <p class="lead">남겨주신 문의는 확인 후 빠른 시일 내에 담당자가 연락드리겠습니다.</p>
        <div class="actions">
          <a class="btn btn-dark" href="/">홈으로 돌아가기</a>
        </div>
      </section>
    </div>
  </main>
</body>
</html>
